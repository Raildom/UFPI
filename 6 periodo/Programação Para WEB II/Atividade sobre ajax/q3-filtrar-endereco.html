<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3 – Filtrar por Endereço Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f; --surface: #141418; --card: #1a1a22;
    --border: #2a2a38; --accent: #e8ff47; --accent2: #47c4ff;
    --text: #f0f0f0; --muted: #888; --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; padding: 2rem 1rem 4rem; }

  header { text-align: center; margin-bottom: 2.5rem; }
  header .tag { font-size: .68rem; color: var(--accent); letter-spacing: .2em; text-transform: uppercase; }
  header h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.4rem,4vw,2.2rem); font-weight: 800; margin-top: .4rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: .75rem; margin-top: .4rem; }

  .wrapper { max-width: 820px; margin: 0 auto; }

  .search-bar {
    display: flex; gap: .75rem; margin-bottom: 1.5rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.2rem;
  }
  .search-bar input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: 'Space Mono', monospace;
    font-size: .85rem; padding: .6rem .9rem; outline: none; transition: border-color .15s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  button {
    cursor: pointer; font-family: 'Space Mono', monospace; font-size: .82rem;
    background: var(--accent); color: #000; font-weight: 700;
    border: none; border-radius: 8px; padding: .6rem 1.3rem;
    transition: all .15s; white-space: nowrap;
  }
  button:hover { background: #d4eb2c; transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { font-size: .75rem; color: var(--muted); margin-bottom: 1rem; min-height: 1.2rem; }
  .status.err { color: var(--red); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: .9rem; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.1rem;
    animation: fadeIn .3s ease both;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; } }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .7rem; }
  .card h4 { font-size: .9rem; color: var(--accent); line-height: 1.3; }

  .info-row { display: flex; align-items: flex-start; gap: .5rem; margin-bottom: .45rem; font-size: .78rem; }
  .info-row .label { color: var(--muted); font-size: .68rem; min-width: 56px; }
  .info-row .val { color: #ddd; line-height: 1.5; }
  .info-row .val strong { color: var(--accent2); }

  mark {
    background: rgba(232,255,71,.25); color: var(--accent);
    border-radius: 2px; padding: 0 2px;
  }

  .badge {
    display: inline-block; padding: .15rem .55rem; border-radius: 20px;
    font-size: .65rem; font-weight: 700;
    background: rgba(71,196,255,.15); color: var(--accent2);
    border: 1px solid rgba(71,196,255,.3);
  }

  .empty { text-align: center; color: var(--muted); font-size: .82rem; padding: 3rem 0; }

  .hint {
    font-size: .72rem; color: var(--muted);
    padding: .6rem .9rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 1.2rem;
  }
  .hint span { color: var(--accent); }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>Filtrar Usuários por <span>Endereço Completo</span></h1>
    <p>Busca em street + suite + city (case insensitive) · usuários carregados uma única vez</p>
  </header>

  <div class="hint">
    Exemplos de busca: <span>Apt</span>, <span>Suite</span>, <span>North</span>, <span>Gwenborough</span>, <span>Wisoky</span>
  </div>

  <div class="search-bar">
    <input type="text" id="busca" placeholder="Digite parte do endereço…" autofocus>
    <button id="btn-filtrar">Filtrar</button>
  </div>

  <p class="status" id="status"></p>
  <div class="grid" id="resultado"></div>
</div>

<script>
  const BASE = 'https://jsonplaceholder.typicode.com';
  let usersCache = null; // cache: só faz a requisição uma vez

  function xhr(url) {
    return new Promise((resolve, reject) => {
      const req = new XMLHttpRequest();
      req.open('GET', url);
      req.onload = () => {
        if (req.status >= 200 && req.status < 300) resolve(JSON.parse(req.responseText));
        else reject(new Error('Erro HTTP ' + req.status));
      };
      req.onerror = () => reject(new Error('Erro de rede'));
      req.send();
    });
  }

  // Destaca o termo encontrado no texto usando <mark>
  function highlight(text, termo) {
    const re = new RegExp(`(${termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(re, '<mark>$1</mark>');
  }

  async function filtrar() {
    const termo     = document.getElementById('busca').value.trim();
    const container = document.getElementById('resultado');
    const status    = document.getElementById('status');
    const btn       = document.getElementById('btn-filtrar');

    if (!termo) {
      status.textContent = 'Digite algo para buscar.';
      container.innerHTML = '';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    status.className = 'status';
    status.textContent = '';
    container.innerHTML = '';

    try {
      // Carrega /users apenas na primeira vez (cache)
      if (!usersCache) {
        status.textContent = 'Carregando usuários…';
        usersCache = await xhr(`${BASE}/users`);
      }

      const termoLower = termo.toLowerCase();

      // Filtra concatenando street + suite + city em uma só string
      const filtrados = usersCache.filter(u => {
        const addr = `${u.address.street} ${u.address.suite} ${u.address.city}`.toLowerCase();
        return addr.includes(termoLower);
      });

      if (!filtrados.length) {
        container.innerHTML = '<div class="empty">Nenhum usuário encontrado com esse endereço.</div>';
        status.textContent = 'Resultado: 0 usuários encontrados';
        return;
      }

      status.textContent = `${filtrados.length} usuário(s) encontrado(s) para "${termo}"`;

      filtrados.forEach((u, i) => {
        const enderecoCompleto = `${u.address.street}, ${u.address.suite}, ${u.address.city}`;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = (i * 50) + 'ms';
        card.innerHTML = `
          <div class="card-top">
            <h4>${u.name}</h4>
            <span class="badge">${u.username}</span>
          </div>
          <div class="info-row">
            <span class="label">Endereço</span>
            <span class="val">${highlight(enderecoCompleto, termo)}</span>
          </div>
          <div class="info-row">
            <span class="label">Email</span>
            <span class="val"><strong>${u.email}</strong></span>
          </div>
          <div class="info-row">
            <span class="label">Empresa</span>
            <span class="val">${u.company.name}</span>
          </div>
        `;
        container.appendChild(card);
      });

    } catch (e) {
      status.className = 'status err';
      status.textContent = 'Erro: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Filtrar';
    }
  }

  document.getElementById('btn-filtrar').addEventListener('click', filtrar);

  // Permite pressionar Enter no input para filtrar
  document.getElementById('busca').addEventListener('keydown', e => {
    if (e.key === 'Enter') filtrar();
  });
</script>
</body>
</html>
