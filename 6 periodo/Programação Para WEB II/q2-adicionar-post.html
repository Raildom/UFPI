<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2 – Adicionar Post com Usuário Selecionado</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f; --surface: #141418; --card: #1a1a22;
    --border: #2a2a38; --accent: #e8ff47; --accent2: #47c4ff;
    --text: #f0f0f0; --muted: #888;
    --green: #4ade80; --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; padding: 2rem 1rem 4rem; }

  header { text-align: center; margin-bottom: 2.5rem; }
  header .tag { font-size: .68rem; color: var(--accent); letter-spacing: .2em; text-transform: uppercase; }
  header h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.4rem,4vw,2.2rem); font-weight: 800; margin-top: .4rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: .75rem; margin-top: .4rem; }

  .wrapper { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 600px) { .wrapper { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.4rem;
  }
  .panel h3 {
    font-family: 'Syne', sans-serif; font-size: .95rem;
    color: var(--accent); margin-bottom: 1.1rem; padding-bottom: .6rem;
    border-bottom: 1px solid var(--border);
  }

  label { display: block; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }
  .field { margin-bottom: .9rem; }

  input, select, textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: 'Space Mono', monospace;
    font-size: .82rem; padding: .55rem .8rem; outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--card); }
  textarea { resize: vertical; min-height: 90px; }

  button {
    width: 100%; cursor: pointer; font-family: 'Space Mono', monospace; font-size: .82rem;
    background: var(--accent); color: #000; font-weight: 700;
    border: none; border-radius: 8px; padding: .7rem 1rem;
    transition: all .15s; margin-top: .3rem;
  }
  button:hover { background: #d4eb2c; transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .msg {
    margin-top: .9rem; padding: .65rem .9rem; border-radius: 6px;
    font-size: .78rem; display: none;
  }
  .msg.show { display: block; }
  .msg.ok  { background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.3); color: var(--green); }
  .msg.err { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3); color: var(--red); }

  /* Feed */
  .feed-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: .8rem;
  }
  .feed-header h3 { font-family: 'Syne', sans-serif; font-size: .95rem; color: var(--accent); border: none; padding: 0; margin: 0; }
  .feed-count { font-size: .68rem; color: var(--muted); }

  .post-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: .9rem; margin-bottom: .6rem;
    animation: slideIn .3s ease both;
  }
  @keyframes slideIn { from { opacity:0; transform: translateX(-10px); } to { opacity:1; transform: translateX(0); } }

  .post-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; margin-bottom: .35rem; }
  .post-card h4 { font-size: .85rem; color: var(--accent2); flex: 1; line-height: 1.4; }
  .post-card p  { font-size: .75rem; color: #ccc; line-height: 1.6; }
  .post-card .footer { margin-top: .5rem; display: flex; gap: .5rem; font-size: .68rem; color: var(--muted); }

  .badge {
    display: inline-block; padding: .15rem .5rem; border-radius: 20px;
    font-size: .65rem; font-weight: 700; white-space: nowrap;
  }
  .badge-blue { background: rgba(71,196,255,.15); color: var(--accent2); border: 1px solid rgba(71,196,255,.3); }
  .badge-accent { background: rgba(232,255,71,.12); color: var(--accent); border: 1px solid rgba(232,255,71,.3); }

  .empty { color: var(--muted); font-size: .78rem; text-align: center; padding: 2rem 0; }
</style>
</head>
<body>

<div style="max-width:820px;margin:0 auto 2rem;">
  <header>
    <p class="tag">Questão 2 · Raildom Da Rocha Sobrinho</p>
    <h1>Adicionar Post com <span>Usuário Selecionado</span></h1>
    <p>POST para /posts com título, corpo e userId · feed mantém os últimos 7</p>
  </header>
</div>

<div class="wrapper">
  <!-- Formulário -->
  <div class="panel">
    <h3>📝 Novo Post</h3>

    <div class="field">
      <label>Título *</label>
      <input type="text" id="titulo" placeholder="Título do post…">
    </div>

    <div class="field">
      <label>Corpo *</label>
      <textarea id="body" placeholder="Escreva o conteúdo aqui…"></textarea>
    </div>

    <div class="field">
      <label>Usuário *</label>
      <select id="userId">
        <option value="">Selecione o usuário…</option>
        <option value="1">Usuário 1</option><option value="2">Usuário 2</option>
        <option value="3">Usuário 3</option><option value="4">Usuário 4</option>
        <option value="5">Usuário 5</option><option value="6">Usuário 6</option>
        <option value="7">Usuário 7</option><option value="8">Usuário 8</option>
        <option value="9">Usuário 9</option><option value="10">Usuário 10</option>
      </select>
    </div>

    <button id="btn-publicar">Publicar Post</button>
    <div id="msg" class="msg"></div>
  </div>

  <!-- Feed -->
  <div class="panel">
    <div class="feed-header">
      <h3>📰 Feed Recente</h3>
      <span class="feed-count" id="feed-count">0 / 7</span>
    </div>
    <div id="feed">
      <div class="empty">Nenhum post publicado ainda.</div>
    </div>
  </div>
</div>

<script>
  const BASE = 'https://jsonplaceholder.typicode.com';
  const feedPosts = []; // array de posts publicados (max 7)

  function xhrPost(url, data) {
    return new Promise((resolve, reject) => {
      const req = new XMLHttpRequest();
      req.open('POST', url);
      req.setRequestHeader('Content-Type', 'application/json');
      req.onload = () => {
        if (req.status >= 200 && req.status < 300) {
          resolve(JSON.parse(req.responseText));
        } else {
          reject(new Error('Erro HTTP ' + req.status));
        }
      };
      req.onerror = () => reject(new Error('Erro de rede'));
      req.send(JSON.stringify(data));
    });
  }

  function renderFeed() {
    const feed = document.getElementById('feed');
    document.getElementById('feed-count').textContent = `${feedPosts.length} / 7`;

    if (!feedPosts.length) {
      feed.innerHTML = '<div class="empty">Nenhum post publicado ainda.</div>';
      return;
    }

    feed.innerHTML = '';
    feedPosts.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'post-card';
      card.style.animationDelay = (i * 30) + 'ms';
      card.innerHTML = `
        <div class="top">
          <h4>${p.title}</h4>
          <span class="badge badge-blue">ID: ${p.id}</span>
        </div>
        <p>${p.body.slice(0, 90)}…</p>
        <div class="footer">
          <span class="badge badge-accent">Usuário ${p.userId}</span>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  document.getElementById('btn-publicar').addEventListener('click', async function () {
    const titulo = document.getElementById('titulo').value.trim();
    const body   = document.getElementById('body').value.trim();
    const userId = parseInt(document.getElementById('userId').value);
    const msg    = document.getElementById('msg');
    const btn    = this;

    // Validação
    if (!titulo || !body || !userId) {
      msg.className = 'msg show err';
      msg.textContent = 'Preencha todos os campos antes de publicar.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Publicando…';
    msg.className = 'msg show ok';
    msg.textContent = 'Enviando requisição POST…';

    try {
      // POST para /posts com os dados do formulário
      const post = await xhrPost(`${BASE}/posts`, { title: titulo, body, userId });

      msg.textContent = `✅ Post criado com ID: ${post.id}`;

      // Adiciona no início do array (mais recente primeiro)
      feedPosts.unshift(post);

      // Mantém apenas os últimos 7
      if (feedPosts.length > 7) feedPosts.pop();

      renderFeed();

      // Limpa os campos do formulário
      document.getElementById('titulo').value = '';
      document.getElementById('body').value = '';
      document.getElementById('userId').value = '';

    } catch (e) {
      msg.className = 'msg show err';
      msg.textContent = 'Erro ao publicar: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publicar Post';
    }
  });
</script>
</body>
</html>
