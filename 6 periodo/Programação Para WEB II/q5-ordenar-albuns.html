<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5 – Ordenar Álbuns por Tamanho</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f; --surface: #141418; --card: #1a1a22;
    --border: #2a2a38; --accent: #e8ff47; --accent2: #47c4ff;
    --text: #f0f0f0; --muted: #888;
    --green: #4ade80; --yellow: #facc15; --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; padding: 2rem 1rem 4rem; }

  header { text-align: center; margin-bottom: 2.5rem; }
  header .tag { font-size: .68rem; color: var(--accent); letter-spacing: .2em; text-transform: uppercase; }
  header h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.4rem,4vw,2.2rem); font-weight: 800; margin-top: .4rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: .75rem; margin-top: .4rem; }

  .wrapper { max-width: 760px; margin: 0 auto; }

  .controls {
    display: flex; gap: .75rem; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.2rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }

  .field { flex: 1; min-width: 200px; }
  label { display: block; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .35rem; }
  select {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: 'Space Mono', monospace;
    font-size: .82rem; padding: .6rem .8rem; outline: none; transition: border-color .15s;
  }
  select:focus { border-color: var(--accent); }
  select option { background: var(--card); }

  button {
    cursor: pointer; font-family: 'Space Mono', monospace; font-size: .82rem;
    background: var(--accent); color: #000; font-weight: 700;
    border: none; border-radius: 8px; padding: .65rem 1.3rem;
    transition: all .15s; white-space: nowrap;
  }
  button:hover { background: #d4eb2c; transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { font-size: .75rem; color: var(--muted); margin-bottom: 1rem; min-height: 1rem; }
  .status.err { color: var(--red); }

  /* Barra de ranking */
  .album-row {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: .85rem 1rem; margin-bottom: .55rem;
    display: grid; grid-template-columns: 28px 1fr auto;
    align-items: center; gap: .9rem;
    animation: fadeIn .3s ease both;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; } }

  .rank-num {
    font-size: .75rem; font-weight: 700; color: var(--muted);
    text-align: center; width: 28px;
  }
  .rank-num.top { color: var(--accent); }

  .album-info {}
  .album-title { font-size: .82rem; line-height: 1.4; margin-bottom: .25rem; }
  .album-sub { font-size: .68rem; color: var(--muted); }

  /* Barra de progresso proporcional */
  .bar-wrap {
    width: 100%; background: var(--border); border-radius: 4px; height: 4px; margin-top: .4rem;
  }
  .bar-fill { height: 4px; border-radius: 4px; transition: width .6s ease; }
  .bar-green  { background: var(--green); }
  .bar-yellow { background: var(--yellow); }
  .bar-red    { background: var(--red); }

  .badge {
    display: inline-flex; align-items: center; gap: .3rem;
    padding: .2rem .65rem; border-radius: 20px; font-size: .68rem; font-weight: 700; white-space: nowrap;
  }
  .badge-green  { background: rgba(74,222,128,.15);  color: var(--green);  border: 1px solid rgba(74,222,128,.3); }
  .badge-yellow { background: rgba(250,204,21,.15);  color: var(--yellow); border: 1px solid rgba(250,204,21,.3); }
  .badge-red    { background: rgba(248,113,113,.15); color: var(--red);    border: 1px solid rgba(248,113,113,.3); }
  .badge-gray   { background: rgba(136,136,136,.15); color: var(--muted);  border: 1px solid rgba(136,136,136,.3); }

  .legend {
    display: flex; gap: 1rem; flex-wrap: wrap;
    margin-bottom: 1.2rem; padding: .7rem 1rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font-size: .7rem; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>Ordenar Álbuns por <span>Nº de Fotos</span></h1>
    <p>Álbuns e fotos carregados uma vez · ordenação feita localmente sem nova requisição</p>
  </header>

  <div class="controls">
    <div class="field">
      <label>Ordenação</label>
      <select id="ordem">
        <option value="desc">Mais fotos → menos fotos</option>
        <option value="asc">Menos fotos → mais fotos</option>
      </select>
    </div>
    <button id="btn-carregar">Carregar e Ordenar Álbuns</button>
  </div>

  <p class="status" id="status"></p>

  <div class="legend" id="legend" style="display:none">
    <span>🟢 verde = mais de 60 fotos</span>
    <span>🟡 amarelo = 31–60 fotos</span>
    <span>🔴 vermelho = até 30 fotos</span>
  </div>

  <div id="lista-albuns"></div>
</div>

<script>
  const BASE = 'https://jsonplaceholder.typicode.com';

  // Cache: dados carregados apenas uma vez
  let albumsCache = null;
  let photosCountCache = null; // mapa albumId → quantidade de fotos

  function xhr(url) {
    return new Promise((resolve, reject) => {
      const req = new XMLHttpRequest();
      req.open('GET', url);
      req.onload = () => {
        if (req.status >= 200 && req.status < 300) resolve(JSON.parse(req.responseText));
        else reject(new Error('Erro HTTP ' + req.status));
      };
      req.onerror = () => reject(new Error('Erro de rede'));
      req.send();
    });
  }

  function badgeInfo(n) {
    if (n > 60) return { cls: 'badge-green',  barCls: 'bar-green' };
    if (n > 30) return { cls: 'badge-yellow', barCls: 'bar-yellow' };
    return       { cls: 'badge-red',   barCls: 'bar-red' };
  }

  document.getElementById('btn-carregar').addEventListener('click', async function () {
    const btn    = this;
    const lista  = document.getElementById('lista-albuns');
    const status = document.getElementById('status');
    const legend = document.getElementById('legend');
    const ordem  = document.getElementById('ordem').value;

    btn.disabled = true;
    lista.innerHTML = '';
    legend.style.display = 'none';

    try {
      // Carrega álbuns e fotos apenas na PRIMEIRA vez
      if (!albumsCache || !photosCountCache) {
        btn.innerHTML = '<span class="spinner"></span> Baixando álbuns…';
        status.textContent = 'Carregando álbuns (pode demorar alguns segundos)…';

        // Busca em paralelo álbuns e todas as fotos
        const [albums, photos] = await Promise.all([
          xhr(`${BASE}/albums?_limit=15`),
          xhr(`${BASE}/photos`)
        ]);

        albumsCache = albums;

        // Conta fotos por albumId localmente
        photosCountCache = {};
        photos.forEach(p => {
          photosCountCache[p.albumId] = (photosCountCache[p.albumId] || 0) + 1;
        });
      }

      // Adiciona a contagem de fotos em cada álbum
      const albumsComFotos = albumsCache.map(a => ({
        ...a,
        numFotos: photosCountCache[a.id] || 0
      }));

      // Ordena LOCALMENTE (sem nova requisição) conforme o select
      albumsComFotos.sort((a, b) =>
        ordem === 'asc'
          ? a.numFotos - b.numFotos
          : b.numFotos - a.numFotos
      );

      const maxFotos = Math.max(...albumsComFotos.map(a => a.numFotos));

      status.textContent = `${albumsComFotos.length} álbuns ordenados por ${ordem === 'desc' ? 'mais → menos' : 'menos → mais'} fotos`;
      legend.style.display = 'flex';

      albumsComFotos.forEach((a, i) => {
        const { cls, barCls } = badgeInfo(a.numFotos);
        const pct = maxFotos > 0 ? (a.numFotos / maxFotos) * 100 : 0;
        const row = document.createElement('div');
        row.className = 'album-row';
        row.style.animationDelay = (i * 35) + 'ms';
        row.innerHTML = `
          <span class="rank-num ${i < 3 ? 'top' : ''}">${i + 1}</span>
          <div class="album-info">
            <div class="album-title">${a.title.slice(0, 55)}${a.title.length > 55 ? '…' : ''}</div>
            <div class="album-sub">ID ${a.id} · Usuário ${a.userId}</div>
            <div class="bar-wrap"><div class="bar-fill ${barCls}" style="width:${pct.toFixed(1)}%"></div></div>
          </div>
          <span class="badge ${cls}">${a.numFotos} fotos</span>
        `;
        lista.appendChild(row);
      });

    } catch (e) {
      status.className = 'status err';
      status.textContent = 'Erro: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Reordenar';
    }
  });

  // Ao mudar o select depois que os dados já foram carregados,
  // reordena localmente sem pedir nada ao servidor
  document.getElementById('ordem').addEventListener('change', () => {
    if (albumsCache) document.getElementById('btn-carregar').click();
  });
</script>
</body>
</html>
